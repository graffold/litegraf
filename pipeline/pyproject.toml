[project]
name = "biokg-ingest"
version = "0.1.0"
description = "Knowledge graph ingestion and enrichment pipeline"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0",
    "biopython>=1.85",
    "obonet>=1.1.1",
    "sentence-transformers>=3.0.0",
    "ollama>=0.4.8",
    "aiohttp>=3.9.0",
    "orjson>=3.9.0",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.0.0"]
bedrock = ["boto3>=1.38.0", "langchain-aws>=0.2.0"]
redis = ["redis>=5.0.0", "hiredis>=2.3.0"]
all = ["biokg-ingest[neo4j,bedrock,redis]"]

[project.scripts]
biokg-ingest = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
