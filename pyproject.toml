[project]
name = "litegraf"
version = "0.1.0"
description = "Lightweight knowledge graph ingestion and enrichment pipeline"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0",
    "biopython>=1.85",
    "obonet>=1.1.1",
    "sentence-transformers>=3.0.0",
    "ollama>=0.4.8",
    "aiohttp>=3.9.0",
    "orjson>=3.9.0",
    "neo4j-graphrag>=1.13.0",
    "langgraph>=0.4.0",
    "httpx>=0.27.0",
    "nano-graphrag>=0.0.8.2",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.0.0"]
bedrock = ["boto3>=1.38.0", "langchain-aws>=0.2.0"]
redis = ["redis>=5.0.0", "hiredis>=2.3.0"]
all = ["litegraf[neo4j,bedrock,redis]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-timeout>=2.0",
    "hypothesis>=6.0",
    "ruff>=0.15.0",
]

[project.scripts]
litegraf = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: integration tests requiring live services",
    "properties: property-based tests using hypothesis",
]
